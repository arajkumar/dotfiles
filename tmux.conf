# vim:ft=conf:

setw -g mode-keys vi

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows and panes open in the current directory
bind c   new-window   -c '#{pane_current_path}'
bind '"' split-window    -c '#{pane_current_path}'
bind %   split-window -h -c '#{pane_current_path}'

set -g set-clipboard on

# Copy to clipboard
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi 'y' send -X copy-pipe-and-cancel

# record window selection for MRU ordering and jumplist
set-hook -g after-select-window 'run-shell -b "$HOME/dotfiles/tmux-mru record #S:#I"'

# jump back/forward through visited windows (vim Ctrl-o/Ctrl-i)
bind C-o run-shell -b "$HOME/dotfiles/tmux-mru back"
# Tab and C-i are the same keycode; bind both in case extended-keys splits them
bind C-i run-shell -b "$HOME/dotfiles/tmux-mru forward"
bind Tab run-shell -b "$HOME/dotfiles/tmux-mru forward"

# pick a window (session:index name) from a centered popup (fzf, numbered)
bind s display-popup -w 50% -h 50% -E "tmux list-windows -a -F '#S:#I #W' | awk '{printf \"%2d  %s\\n\", NR, \$0}' | fzf --reverse --bind 'j:down,k:up,1:pos(1)+accept,2:pos(2)+accept,3:pos(3)+accept,4:pos(4)+accept,5:pos(5)+accept,6:pos(6)+accept,7:pos(7)+accept,8:pos(8)+accept,9:pos(9)+accept' | sed -E 's/^ *[0-9]+  //; s/ .*//' | while read -r t; do tmux switch-client -t \"\$t\"; done"

bind m command-prompt -p man: "split-window -h 'man %1'"

# enable for iTerm (Terminal.app doesn't have mouse support)
set -g mouse on

# start numbering windows from 1 instead of zero
set -g base-index 1
setw -g pane-base-index 1

# syntax highlighting in Vim
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# disable programs changing window names via terminal escape sequence
set-window-option -g allow-rename off

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Automatic restore
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
